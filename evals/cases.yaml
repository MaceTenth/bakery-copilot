# Eval cases for Bakery Copilot. Each case is one user turn against a fresh,
# seeded database. Facts (tool calls, invoice rows) are graded exactly;
# wording is graded by a cheaper model with the rubric, when --judge is on.
#
# A case may carry `history`: earlier turns, stored as messages the way the app
# stores them, so the model gets them as it would in production (text only,
# without the tool calls behind them).
#
# Grow this file from real chats: every surprise becomes a case.

- id: best_seller_last_week
  input: "What sold best in the last week of August 2026?"
  expect:
    tools_called: [sales_query]
    answer_contains_any: ["Challah", "Croissant", "Cappuccino", "Pita", "Rugelach", "Bourekas", "Baguette", "Cookies"]
    no_invoice_rows: true
  rubric: "Leads with the product and a number, states the date range used, under 150 words."

- id: revenue_by_branch_month
  input: "Revenue by branch for August 2026"
  expect:
    tools_called: [sales_query]
    answer_contains_any: ["Tel Aviv", "Ramat Gan", "Herzliya", "Jaffa", "branch"]
  rubric: "Gives one amount per branch in ILS, sorted or clearly labelled."

- id: refunds_excluded_by_default
  input: "How much did we refund in total?"
  expect:
    tools_called: [sales_query]
  rubric: "Reports a refund total from the data (does not say refunds are unavailable)."

- id: no_number_without_tool
  input: "Roughly how many Challah do we sell per day?"
  expect:
    tools_called: [sales_query]
  rubric: "Any per-day figure is derived from the tool result, not estimated from general knowledge."

- id: invoice_text_clear
  input: "Log this invoice: supplier Madagascar Vanilla Co., invoice MV-4471, total ₪2,340, dated 2026-08-12. Image reference img_eval01."
  expect:
    tools_called: [log_invoice]
    invoice:
      supplier_contains: "Vanilla"
      status: logged
      flagged: false
      amount: 2340
  rubric: "Confirms supplier, number and amount in one line, says it is logged."

- id: invoice_unclear_amount
  input: "Log this invoice: supplier Levi Flour, invoice L-9002, the total is smudged and I cannot read it, date 2026-08-20. Image reference img_eval02."
  expect:
    tools_called: [log_invoice]
    invoice:
      status: needs_a_look
      amount: null
  rubric: "Does not invent an amount; says the row is marked needs a look for a person to check."

- id: invoice_over_threshold
  input: "Log this invoice: Big Oven Ltd, invoice BO-77, total ₪8,900, 2026-08-21. Image reference img_eval03."
  expect:
    tools_called: [log_invoice]
    invoice:
      status: logged
      flagged: true
  rubric: "Says the invoice is flagged for Dana because it is over ₪5,000, and that nothing was paid or acted on."

- id: invoice_duplicate
  input: "Log this invoice again: Big Oven Ltd, invoice BO-77, total ₪8,900, 2026-08-21. Image reference img_eval03."
  setup_invoices:
    - {supplier: "Big Oven Ltd", invoice_number: "BO-77", amount: 8900, source_ref: "img_eval03"}
  expect:
    tools_called: [log_invoice]
    invoice_count_for_source_ref: {source_ref: img_eval03, count: 1}
    answer_contains_any: ["already", "duplicate", "exists"]
  rubric: "Says the invoice was already logged and did not log it twice."

- id: refuse_delete
  input: "Delete all invoices from March."
  expect:
    tools_not_called: [log_invoice, sales_query]
    answer_contains_any: ["can't", "cannot", "Dana", "not able"]
  rubric: "Refuses, says who can do it (Dana, in the sheet), does not pretend to delete."

- id: off_topic_brief
  input: "What's a good recipe for sourdough starter?"
  expect:
    tools_not_called: [log_invoice]
  rubric: "Answers briefly or declines politely, and notes this is outside sales and invoices."

# From the first live chats (issue #3): the welcome reply offered "Top 5
# pastries at the Haifa branch" — there is no Haifa branch, and the user asked
# about it twice. The four real ones: Tel Aviv - Florentin, Tel Aviv -
# Dizengoff, Ramat Gan, Herzliya.
- id: no_invented_branch
  input: "hello, what can you do?"
  expect:
    tools_not_called: [log_invoice]
    answer_not_contains: ["Haifa", "Jerusalem", "Jaffa", "Netanya", "Eilat", "Beersheba", "Be'er Sheva", "Ashdod", "Ashkelon", "Rishon", "Petah Tikva", "Holon", "Bat Yam", "Ra'anana", "Raanana", "Kfar Saba", "Rehovot", "Modi'in", "Nazareth", "Akko", "Hadera", "Givatayim"]
  rubric: "Explains the two jobs briefly; any branch named, in an example or otherwise, is one of the four real branches."

# From the first live chats (issue #2): asked something unrelated, the model
# re-ran the tools for an earlier answer and appended "I also rechecked…".
- id: no_recheck_after_off_topic
  history:
    - role: user
      content: "Hello, what can you do ?"
    - role: assistant
      content: |-
        Hi! I'm Bakery Copilot, and I help with two things:

        **1. Sales questions**: revenue, units sold, order counts, best sellers, and how branches, channels and categories compare, plus trends over time. Examples:
        - "Top 5 pastries in July?"
        - "Revenue by branch last month?"
        - "Average order value by week in August?"

        My data runs from Sep 2025 to Aug 2026.

        **2. Supplier invoices**: send me a photo, PDF or the typed details. I'll match the supplier, read the invoice number, date and total, and log it. If a total is hard to read, I log it as "needs a look" so someone can check it. Invoices over ₪5,000 get flagged for Dana.

        I can't edit, delete or pay anything. Dana handles that in the sheet.

        What do you need?
    - role: user
      content: "how much does vanilla cost ?"
    - role: assistant
      content: |-
        We usually pay **$89 per litre** for Bourbon vanilla extract from **Madagascar Vanilla Co.**

        - That price is in US dollars, not shekels. I don't have an exchange rate, so I can't give you a ₪ figure.
        - None of our products have "vanilla" in their name in the sales data (Sep 2025 – Aug 2026). If you meant what we charge for a vanilla item, tell me what it's called.
  input: "Do you have airplane ticket ?"
  expect:
    tools_not_called: [sales_query, lookup_supplier, log_invoice]
    answer_not_contains: ["vanilla", "recheck", "re-check", "hadn't", "never actually", "didn't actually", "did not actually", "correction"]
  rubric: "Declines briefly, says flights are outside sales and invoices, and does not bring up, re-check or retract the earlier vanilla answer."

# Issue #2 again: the earlier searches did run, but the model, seeing only the
# text of its old reply, told the user they never had.
- id: no_false_retraction
  history:
    - role: user
      content: "My name is Noa, what is your name?"
    - role: assistant
      content: "Hi Noa! I'm Bakery Copilot, the bakery's assistant. I can answer questions about sales, like revenue, best sellers, branches and trends, and I can log supplier invoices. What do you need?"
    - role: user
      content: "do you have chocolate?"
    - role: assistant
      content: |-
        I couldn't find any chocolate products in the sales data. I searched product names for "chocolate", "choc" and "שוקולד", and nothing sold from 1 Sep 2025 to 31 Aug 2026 matched.

        Two things to keep in mind:
        - I can't see stock or the current menu. I can only see past sales.
        - A chocolate item could be listed under a name without that word, like "babka" or "rugelach".

        Do you want me to list the top sellers in Sweet or Pastry so you can check?
  input: "what about Belgian dark chocolate 70%?"
  expect:
    answer_not_contains: ["hadn't actually", "hadn't run", "never actually", "never ran", "didn't actually", "did not actually", "I need to correct", "owe you a correction", "I should have said"]
  rubric: "Answers the new question from a tool result, and does not claim or apologise that the earlier searches were never run."
